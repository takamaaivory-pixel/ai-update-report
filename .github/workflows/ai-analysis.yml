name: AI Analysis Report

on:
  workflow_run:
    workflows:
      - Weekly AI Update Report
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate complete AI report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -u scripts/ai_analysis.py

      - name: Validate AI report structure
        id: validate_ai
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              "今週の重要アップデートTOP5",
              "ChatGPT / OpenAI",
              "Gemini / Google",
              "Claude / Anthropic",
              "Microsoft Copilot",
              "内部監査への示唆",
              "今後ウォッチすべき事項",
              "情報源",
          ]
          html = Path("index.html").read_text(encoding="utf-8")
          missing = [x for x in required if x not in html]
          if missing:
              print("AI output is incomplete; the verified baseline will be restored.")
              print("Missing:", ", ".join(missing))
              raise SystemExit(2)
          print("AI report structure validated.")
          PY

      - name: Restore verified complete report baseline
        if: failure()
        shell: bash
        run: |
          git show e963101ffc54fdb3629074f5d7c4cc4717a5788a:index.html > index.html
          echo "Restored verified complete report from commit e963101."

      - name: Update fixed seven-stage audit section
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -u scripts/audit_process_section.py

      - name: Validate seven-stage audit section and full report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              "今週の重要アップデートTOP5",
              "ChatGPT / OpenAI",
              "Gemini / Google",
              "Claude / Anthropic",
              "Microsoft Copilot",
              "内部監査への示唆",
              "内部監査プロセスの高度化への有用性",
              "今後ウォッチすべき事項",
              "情報源",
              "① リスク評価",
              "② 監査計画",
              "③ 資料収集",
              "④ 分析・検証",
              "⑤ 指摘・原因分析",
              "⑥ 報告",
              "⑦ フォローアップ",
          ]
          missing = [x for x in required if x not in html]
          statuses = html.count("更新あり") + html.count("更新なし")
          if missing or statuses < 7:
              raise SystemExit("Final report validation failed: " + ", ".join(missing) + f"; statuses={statuses}")
          print("Final report validation passed: full report + seven audit stages present.")
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Generate complete AI weekly report"
            git push
          fi
