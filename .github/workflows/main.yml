name: Weekly AI Update Report

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate AI update report
        shell: bash
        run: |
          python -u scripts/ai_analysis.py

      - name: Update fixed audit process section
        shell: bash
        run: |
          python -u scripts/audit_process_section.py

      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update weekly AI report"
            git push
          fi
