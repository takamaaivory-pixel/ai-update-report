name: Weekly AI Update Report

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate AI update report
        shell: bash
        run: |
          cat > /tmp/generate_report.py <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import re
          from html import escape
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime
          from html.parser import HTMLParser

          USER_AGENT = "Mozilla/5.0 (AI Update Report)"

          def fetch(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
                  }
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read()

          def clean_text(text):
              text = re.sub(r"\s+", " ", text)
              return text.strip()

          def rss_items(url, limit=8):
              data = fetch(url)
              root = ET.fromstring(data)

              items = []

              for item in root.findall(".//item"):
                  title = (item.findtext("title") or "").strip()
                  link = (item.findtext("link") or "").strip()
                  pub_date = (item.findtext("pubDate") or "").strip()

                  if not title or not link:
                      continue

                  date = ""

                  try:
                      date = parsedate_to_datetime(
                          pub_date
                      ).strftime("%Y-%m-%d")
                  except Exception:
                      pass

                  items.append(
                      (date, title, link)
                  )

                  if len(items) >= limit:
                      break

              return items

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current_href = None
                  self.current_text = []
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "a":
                      return

                  attributes = dict(attrs)
                  href = attributes.get("href")

                  if href:
                      self.current_href = href
                      self.current_text = []

              def handle_data(self, data):
                  if self.current_href is not None:
                      self.current_text.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() != "a":
                      return

                  if self.current_href:
                      title = clean_text(
                          " ".join(self.current_text)
                      )

                      self.links.append(
                          (self.current_href, title)
                      )

                  self.current_href = None
                  self.current_text = []

          def google_gemini_items(limit=8):
              url = (
                  "https://blog.google/"
                  "products-and-platforms/"
                  "products/gemini/"
              )

              html = fetch(url).decode(
                  "utf-8",
                  errors="ignore"
              )

              parser = LinkParser()
              parser.feed(html)

              items = []
              seen = set()

              keywords = [
                  "Gemini",
                  "AI",
                  "Lyria",
                  "Veo",
                  "NotebookLM"
              ]

              for href, title in parser.links:

                  if not title:
                      continue

                  if href.startswith("/"):
                      href = "https://blog.google" + href

                  if not href.startswith(
                      "https://blog.google/"
                  ):
                      continue

                  if href.rstrip("/") == url.rstrip("/"):
                      continue

                  if href in seen:
                      continue

                  if not any(
                      keyword.lower() in title.lower()
                      for keyword in keywords
                  ):
                      continue

                  seen.add(href)

                  items.append(
                      ("", title, href)
                  )

                  if len(items) >= limit:
                      break

              return items

          class AnthropicParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.href = None
                  self.text = []
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "a":
                      return

                  attributes = dict(attrs)
                  href = attributes.get("href", "")

                  if href.startswith("/news/"):
                      self.href = href
                      self.text = []

              def handle_data(self, data):
                  if self.href:
                      self.text.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() != "a":
                      return

                  if self.href:
                      title = clean_text(
                          " ".join(self.text)
                      )

                      if title:
                          self.links.append(
                              (self.href, title)
                          )

                  self.href = None
                  self.text = []

          def anthropic_items(limit=8):
              url = "https://www.anthropic.com/news"

              html = fetch(url).decode(
                  "utf-8",
                  errors="ignore"
              )

              parser = AnthropicParser()
              parser.feed(html)

              items = []
              seen = set()

              for href, title in parser.links:

                  if href in seen:
                      continue

                  seen.add(href)

                  items.append(
                      (
                          "",
                          title,
                          "https://www.anthropic.com" + href
                      )
                  )

                  if len(items) >= limit:
                      break

              return items

          def microsoft_items(limit=8):
              urls = [
                  "https://techcommunity.microsoft.com/"
                  "t5/s/gxcuf89792/rss/"
                  "Category?category.id=Microsoft365Copilot",
                  "https://www.microsoft.com/"
                  "en-us/microsoft-365/blog/feed/"
              ]

              for url in urls:
                  try:
                      items = rss_items(
                          url,
                          limit
                      )

                      if items:
                          return items

                  except Exception:
                      continue

              return []

          sources = []

          try:
              sources.append(
                  (
                      "ChatGPT / OpenAI",
                      rss_items(
                          "https://openai.com/news/rss.xml"
                      )
                  )
              )
          except Exception:
              sources.append(
                  ("ChatGPT / OpenAI", [])
              )

          try:
              sources.append(
                  (
                      "Gemini / Google AI",
                      google_gemini_items()
                  )
              )
          except Exception:
              sources.append(
                  ("Gemini / Google AI", [])
              )

          try:
              sources.append(
                  (
                      "Claude / Anthropic",
                      anthropic_items()
                  )
              )
          except Exception:
              sources.append(
                  ("Claude / Anthropic", [])
              )

          try:
              sources.append(
                  (
                      "Microsoft Copilot",
                      microsoft_items()
                  )
              )
          except Exception:
              sources.append(
                  ("Microsoft Copilot", [])
              )

          def make_section(name, items):
              html = (
                  "<section>"
                  "<h2>"
                  + escape(name)
                  + "</h2>"
              )

              if not items:
                  return (
                      html
                      + "<p class='error'>"
                      "現時点で公式情報を取得できませんでした。"
                      "</p></section>"
                  )

              html += "<ul>"

              for date, title, link in items:

                  date_html = ""

                  if date:
                      date_html = (
                          "<span class='date'>"
                          + escape(date)
                          + "</span>"
                      )

                  html += (
                      "<li>"
                      + date_html
                      + "<a href='"
                      + escape(link)
                      + "' target='_blank' "
                      "rel='noopener'>"
                      + escape(title)
                      + "</a>"
                      "</li>"
                  )

              html += "</ul></section>"

              return html

          jst = timezone(
              timedelta(hours=9)
          )

          now = datetime.now(
              timezone.utc
          ).astimezone(jst)

          sections = ""

          for name, items in sources:
              sections += make_section(
                  name,
                  items
              )

          page = """<!doctype html>
          <html lang="ja">
          <head>
          <meta charset="utf-8">
          <meta name="viewport"
                content="width=device-width, initial-scale=1">

          <title>主要AIアプリ・アップデートまとめ</title>

          <style>
          * {
            box-sizing: border-box;
          }

          body {
            margin: 0;
            padding: 20px;
            background: #f4f6f8;
            color: #202124;
            font-family:
              system-ui,
              -apple-system,
              BlinkMacSystemFont,
              "Noto Sans JP",
              sans-serif;
            line-height: 1.7;
          }

          main {
            max-width: 900px;
            margin: auto;
          }

          header,
          section,
          footer {
            background: white;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 2px 12px rgba(0,0,0,.08);
          }

          h1 {
            margin-top: 0;
          }

          h2 {
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
          }

          li {
            margin: 10px 0;
          }

          a {
            color: #1769aa;
            text-decoration: none;
          }

          a:hover {
            text-decoration: underline;
          }

          .badge {
            display: inline-block;
            background: #e8f0fe;
            color: #174ea6;
            border-radius: 999px;
            padding: 3px 10px;
            font-size: .85em;
          }

          .date {
            color: #777;
            margin-right: 10px;
            font-size: .9em;
          }

          .error {
            color: #b3261e;
          }

          footer {
            color: #666;
            font-size: .9em;
          }

          @media (max-width: 600px) {
            body {
              padding: 10px;
            }

            header,
            section,
            footer {
              padding: 16px;
            }

            h1 {
              font-size: 1.5rem;
            }

            h2 {
              font-size: 1.2rem;
            }
          }
          </style>
          </head>

          <body>
          <main>

          <header>
          <h1>主要AIアプリ・アップデートまとめ</h1>

          <p>
          <span class="badge">自動更新</span>
          ChatGPT / Gemini / Claude / Microsoft Copilot
          </p>

          <p>
          最終更新：
          """ + now.strftime(
              "%Y-%m-%d %H:%M"
          ) + """（日本時間）
          </p>

          <p>
          各社の公式情報を定期的に収集しています。
          </p>
          </header>

          """ + sections + """

          <footer>

          <p>
          情報源は各社の公式サイトを優先しています。
          </p>

          <p>
          このレポートは公開情報に基づく情報整理であり、
          監査判断そのものを代替するものではありません。
          </p>

          </footer>

          </main>
          </body>
          </html>
          """

          with open(
              "index.html",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(page)

          print(
              "AI update report generated successfully."
          )
          PY

          python /tmp/generate_report.py

      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update weekly AI report"
            git push
          fi
