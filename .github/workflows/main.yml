name: Weekly AI Update Report

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate AI update report safely
        shell: bash
        run: python -u scripts/ai_analysis_safe.py

      - name: Update fixed audit process section
        shell: bash
        run: python -u scripts/audit_process_section.py

      - name: Validate final report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              '今週の重要アップデートTOP5','ChatGPT / OpenAI','Gemini / Google',
              'Claude / Anthropic','Microsoft Copilot','内部監査への示唆',
              '内部監査プロセスの高度化への有用性','今後ウォッチすべき事項','情報源',
              '① リスク評価','② 監査計画','③ 資料収集','④ 分析・検証',
              '⑤ 指摘・原因分析','⑥ 報告','⑦ フォローアップ'
          ]
          missing = [x for x in required if x not in html]
          statuses = html.count('更新あり') + html.count('更新なし')
          if missing or statuses < 7:
              raise SystemExit(f'Final report validation failed: missing={missing}; statuses={statuses}')
          print(f'Final report validation passed: all sections and audit steps present; statuses={statuses}')
          PY

      - name: Commit and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Update weekly AI report'
            git push
          fi
